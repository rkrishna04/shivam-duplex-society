<!DOCTYPE html>
<html>
<head><title>Icon Generator</title></head>
<body>
<canvas id="c"></canvas>
<script>
// Generate all PWA icons as PNG data URLs and download them
const sizes = [72, 96, 128, 144, 152, 192, 384, 512];

function generateIcon(size) {
  const canvas = document.createElement('canvas');
  canvas.width = size;
  canvas.height = size;
  const ctx = canvas.getContext('2d');

  // Background gradient
  const grad = ctx.createLinearGradient(0, 0, size, size);
  grad.addColorStop(0, '#0a0820');
  grad.addColorStop(1, '#1a1050');
  ctx.fillStyle = grad;
  // Rounded rect
  const r = size * 0.22;
  ctx.beginPath();
  ctx.moveTo(r, 0); ctx.lineTo(size - r, 0);
  ctx.quadraticCurveTo(size, 0, size, r);
  ctx.lineTo(size, size - r);
  ctx.quadraticCurveTo(size, size, size - r, size);
  ctx.lineTo(r, size); ctx.quadraticCurveTo(0, size, 0, size - r);
  ctx.lineTo(0, r); ctx.quadraticCurveTo(0, 0, r, 0);
  ctx.closePath();
  ctx.fill();

  // Indigo glow circle
  const glow = ctx.createRadialGradient(size*0.5, size*0.42, 0, size*0.5, size*0.42, size*0.38);
  glow.addColorStop(0, 'rgba(79,70,229,0.5)');
  glow.addColorStop(1, 'rgba(79,70,229,0)');
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, size, size);

  // House emoji / building symbol
  const fs = size * 0.48;
  ctx.font = `${fs}px serif`;
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText('🏘', size * 0.5, size * 0.46);

  // "SD" text at bottom
  ctx.font = `bold ${size * 0.13}px Inter, Arial, sans-serif`;
  ctx.fillStyle = 'rgba(165,180,252,0.9)';
  ctx.fillText('SHIVAM', size * 0.5, size * 0.82);

  return canvas.toDataURL('image/png');
}

// Download all icons
sizes.forEach(size => {
  const dataUrl = generateIcon(size);
  const a = document.createElement('a');
  a.href = dataUrl;
  a.download = `icon-${size}.png`;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
});

document.body.innerHTML = '<h2 style="font-family:sans-serif;padding:20px;">✅ All icons downloaded! Move them to the /icons/ folder.</h2>';
</script>
</body>
</html>
