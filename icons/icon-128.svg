<?xml version="1.0" encoding="UTF-8"?>
<svg width="128" height="128" viewBox="0 0 128 128" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0820;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a1050;stop-opacity:1" />
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="42%" r="45%">
      <stop offset="0%" style="stop-color:#4f46e5;stop-opacity:0.55" />
      <stop offset="100%" style="stop-color:#4f46e5;stop-opacity:0" />
    </radialGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#ec4899;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background rounded rect -->
  <rect width="128" height="128" rx="28" ry="28" fill="url(#bg)"/>
  
  <!-- Glow circle -->
  <ellipse cx="64" cy="53.76" rx="51.2" ry="48.64" fill="url(#glow)"/>
  
  <!-- Building/House shape -->
  <!-- Main building body -->
  <rect x="25.6" y="48.64" width="76.8" height="48.64" rx="3.84" fill="#4f46e5" opacity="0.9"/>
  
  <!-- Roof triangle -->
  <polygon points="64,23.04 19.2,51.2 108.8,51.2" fill="url(#accent)" opacity="0.95"/>
  
  <!-- Door -->
  <rect x="53.76" y="71.68" width="20.48" height="25.6" rx="2.56" fill="#0a0820" opacity="0.8"/>
  
  <!-- Windows -->
  <rect x="30.72" y="56.32" width="17.92" height="15.36" rx="2.56" fill="rgba(165,180,252,0.6)"/>
  <rect x="79.36" y="56.32" width="17.92" height="15.36" rx="2.56" fill="rgba(165,180,252,0.6)"/>
  
  <!-- Chimney -->
