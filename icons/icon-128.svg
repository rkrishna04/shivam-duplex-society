  <!-- "SD" text label -->
  <text x="64" y="112.64" text-anchor="middle" font-family="Arial, sans-serif" font-weight="800" font-size="15" fill="rgba(165,180,252,0.85)" letter-spacing="0.64">SHIVAM</text>
